# Local development only. Never deploy this profile or expose its H2 database through ingress.
spring.datasource.url=jdbc:h2:file:./data/blog;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

jwt.secret=${JWT_SECRET}
jwt.cookie.secure=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
upload.antivirus.enabled=false
rate-limit.redis.enabled=false

google.client.id=${GOOGLE_CLIENT_ID:local-placeholder-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:local-placeholder-secret}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:missing_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:missing_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:missing_api_secret}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.username=${MAIL_USERNAME:missing_username}
spring.mail.password=${MAIL_PASSWORD:missing_password}
